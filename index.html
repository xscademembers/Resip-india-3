<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a365d" />
    <meta name="description" content="ReSip India Handcrafted, sustainable, upcycled glassware. Premium designer glasses made from discarded bottles. Shop tumblers, shots, jars &amp; more." />
    <link rel="manifest" href="/manifest.json" />
    <title>Resip India | Premium Upcycled Glassware</title>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://static.wixstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://static.wixstatic.com" />

    <!-- Preload actual first hero slide (matches Home fallback / seeded banners) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="https://static.wixstatic.com/media/9356bd_c8da8f804c0040c6917734181d2df3df~mv2.jpeg/v1/fit/w_720,h_405,al_c,q_68,usm_0.66_1.00_0.01/image.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="https://static.wixstatic.com/media/9356bd_c8da8f804c0040c6917734181d2df3df~mv2.jpeg/v1/fit/w_1200,h_675,al_c,q_68,usm_0.66_1.00_0.01/image.webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <link
      rel="icon"
      type="image/png"
      href="https://static.wixstatic.com/media/9356bd_a4f67380f1ee44fc85bbaddce42a4556~mv2.png"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="https://static.wixstatic.com/media/9356bd_a4f67380f1ee44fc85bbaddce42a4556~mv2.png/v1/fit/w_200,h_57,al_c,q_75,usm_0.66_1.00_0.01/image.webp"
    />

    <!-- Fewer font weights = faster first paint -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
